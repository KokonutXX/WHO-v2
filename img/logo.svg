<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="UniVerse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a52ff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- stars -->
  <circle cx="13" cy="14" r="1.8" fill="#fff"/>
  <circle cx="51" cy="12" r="1.2" fill="#fff" opacity=".8"/>
  <circle cx="54" cy="52" r="1.5" fill="#fff" opacity=".7"/>
